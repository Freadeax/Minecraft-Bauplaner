// Bauplaner-Brücke: versionsneutraler Kern plus je Loader und Minecraft-Version ein dünner Adapter.
// Adapter-Projekte werden nur mit ihrem Schalter eingebunden (-PwithFabric, -PwithNeoForge, -PwithForge, …),
// damit der Kern auch ohne Zugriff auf Loader-/Mojang-Server gebaut und getestet werden kann.
pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'bauplaner-bridge'
include 'core'
if (providers.gradleProperty('withFabric').isPresent()) {
    include 'fabric-26.3'
}
if (providers.gradleProperty('withNeoForge').isPresent()) {
    include 'neoforge-26.3'
}
if (providers.gradleProperty('withForge').isPresent()) {
    include 'forge-26.3'
}
