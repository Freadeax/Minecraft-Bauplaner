// Bauplaner-Brücke: versionsneutraler Kern plus je Loader und Minecraft-Version ein dünner Adapter.
// Adapter-Projekte werden nur mit ihrem Schalter eingebunden (-PwithFabric, -PwithNeoForge, -PwithForge, …),
// damit der Kern auch ohne Zugriff auf Loader-/Mojang-Server gebaut und getestet werden kann.
pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
// Wie in den Loader-MDKs: fehlende Java-Versionen (z. B. Java 8 für den Forge-Startprozess) lädt Gradle selbst.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'bauplaner-bridge'
include 'core'
// Bauplaner-Mod 2.0: versionsneutraler Kern (Plan, Platzierung, Blockregeln, Live-Abgleich).
include 'mod-core'
if (providers.gradleProperty('withFabric').isPresent()) {
    include 'fabric-26.3'
}
// Minecraft 26.4 (Snapshot, Vorbereitung GAME-11-S02): eigener Schalter, damit 26.3-Builds keine Snapshot-Daten laden.
if (providers.gradleProperty('withFabric264').isPresent()) {
    include 'fabric-26.4'
}
if (providers.gradleProperty('withNeoForge').isPresent()) {
    include 'neoforge-26.3'
}
if (providers.gradleProperty('withForge').isPresent()) {
    include 'forge-26.3'
}
// Paper-Plugin: eine .jar für alle unterstützten Minecraft-Versionen (Bukkit-API), braucht repo.papermc.io.
if (providers.gradleProperty('withPaper').isPresent()) {
    include 'paper'
}
