// Fabric-Adapter für Minecraft 26.4 (Vorbereitung, GAME-11-S02). 26.3 bleibt unverändert: Dieser Adapter
// nimmt die Quellen von fabric-26.3 und hologram-26.3 (dazu den Spieltest) und passt sie mit den Regeln aus
// compat-26.4.gradle an. Ganze Dateien unter src/override/java ersetzen die gleichnamige gemeinsame Datei.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = "bauplaner-bridge-fabric-${minecraft_family}" }
version = rootProject.file('VERSION').text.trim()
group = 'io.github.freadeax.bauplaner'

def overrideRoot = file('src/override/java')
def rulesFile = file('compat-26.4.gradle')
apply from: rulesFile
def compatRules = ext.compatRules

// Gemeinsame Quellen spiegeln und die Regeln anwenden. Jede Regel muss mindestens einmal greifen, sonst bricht
// der Build ab: so fällt auf, wenn sich die 26.3-Quelle geändert hat und die Regel nachgezogen werden muss.
def mirror = { String name, String set, List roots ->
    def out = layout.buildDirectory.dir(name)
    def task = tasks.register('sync' + name.split('-').collect { it.capitalize() }.join(''), Sync) {
        inputs.file rulesFile
        roots.each { root ->
            from(root) { exclude { e -> !e.directory && new File(overrideRoot, e.relativePath.pathString).exists() } }
        }
        into out
        doLast {
            def base = out.get().dir('io/github/freadeax/bauplaner/bridge').asFile
            def stale = []
            compatRules.findAll { (it.set ?: 'main') == set }.groupBy { it.file }.each { path, list ->
                def f = new File(base, path)
                if (!f.exists()) { stale.addAll(list); return }
                def text = f.getText('UTF-8')
                list.each { r ->
                    def m = text =~ r.find
                    if (!m.find()) { stale << r; return }
                    text = m.replaceAll(r.to)
                }
                f.setText(text, 'UTF-8')
            }
            if (stale) throw new GradleException('Regeln für 26.4 greifen nicht (26.3-Quelle geändert?): ' + stale.collect { it.file + ' · ' + it.find }.join('; '))
        }
    }
    files(out).builtBy(task)
}

sourceSets.main.java.srcDir mirror('shared-src', 'main', [file('../fabric-26.3/src/main/java'), file('../hologram-26.3/src/main/java')])
sourceSets.main.java.srcDir overrideRoot
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.java.srcDir '../mod-core/src/main/java'
evaluationDependsOn(':mod-core')
sourceSets.main.java.srcDir(files(project(':mod-core').teamLogRoot).builtBy(project(':mod-core').teamLogTask))
sourceSets.main.resources.srcDir '../fabric-26.3/src/main/resources'
sourceSets.main.resources.srcDir '../hologram-26.3/src/main/resources'

// Derselbe echte Spieltest wie für 26.3 (Fabric Client Game Test), nur über scripts/mod/test_bridge_ingame.sh 26.4.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'bauplaner_bridge_gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
sourceSets.gametest.java.srcDir mirror('shared-gametest-src', 'gametest', [file('../fabric-26.3/src/gametest/java')])
sourceSets.gametest.resources.srcDir '../fabric-26.3/src/gametest/resources'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def props = [version: project.version, minecraft: minecraft_dependency, loader: loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
