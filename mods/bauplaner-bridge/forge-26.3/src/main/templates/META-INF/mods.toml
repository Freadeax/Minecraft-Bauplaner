modLoader="javafml"
loaderVersion="${forge_version_range}"
license="MIT"
issueTrackerURL="https://github.com/Freadeax/Minecraft-Bauplaner/issues"
# Reine Client-Mod: Server müssen sie nicht haben, der Client darf ohne sie auf jeden Server.
clientSideOnly=true

[[mods]]
modId="bauplaner_bridge"
version="${version}"
displayName="LMNT — Build Studio Bridge"
displayURL="https://freadeax.github.io/Minecraft-Bauplaner/#/mod"
authors="Freadeax"
displayTest="IGNORE_ALL_VERSION"
description='''
Liest den Bereich eines Bauplans aus der Welt und schreibt eine Aufnahme, die LMNT — Build Studio im Tab „Bauen“ vergleicht. Nur lesend, reine Client-Mod: setzt keine Blöcke, sendet nichts ins Internet, braucht nichts auf dem Server.
'''

[[dependencies.bauplaner_bridge]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.bauplaner_bridge]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
