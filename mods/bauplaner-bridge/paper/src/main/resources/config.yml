# Build-Studio-Brücke (Paper). Pläne:   plugins/BauplanerBridge/plans/*.schem  (von der Website, Tab „Export“)
#                            Aufnahmen: plugins/BauplanerBridge/scans/*.schem  (auf der Website im Tab „Bauen“ importieren)
# Das Plugin setzt und entfernt nie Blöcke und erzeugt nie neues Gelände.

# Höchstens so viele Millisekunden je Server-Tick lesen (50 ms = ein ganzer Tick). Kleiner = weniger Last, längere Aufnahme.
millisekunden-pro-tick: 8
# Nicht geladene, aber bereits erzeugte Chunks während der Aufnahme nachladen (Recht bauplaner.nachladen).
# Noch nie erzeugte Chunks werden nie erzeugt, sondern als „nicht aufgenommen“ geschrieben.
chunks-nachladen: true
# Obergrenze der nachzuladenden Chunks je Aufnahme (16×16 Blöcke je Chunk).
max-chunks: 4096

# Teambau (plugins/BauplanerBridge/team/*.team.json aus dem Planer, Reiter „Team“ → „Serverdatei“).
team:
  # Aktionsleiste „Abschnitt 3 · Dach · Anna · in Arbeit“, sobald jemand in einem Abschnitt steht.
  anzeige: true
  # Spieler treten mit ihrem ersten Teambefehl selbst als Helfer bei (sonst nimmt die Bauleitung sie auf).
  neue-spieler-beitreten: true
  # Bauen in Abschnitten, die ein anderer übernommen hat: hinweis (Chatzeile), sperren (Blocksetzen/-abbauen verhindert;
  # Inhaber, Baumeister, Bauleitung und bauplaner.team.leitung ausgenommen) oder aus.
  schutz: hinweis
  # Baunachweis (COOP-04): zählt gesetzte und abgebaute Blöcke von Teammitgliedern, nur innerhalb der Abschnitte des Teams.
  # Jeder Spieler kann ihn mit /bauplaner nachweis aus für sich abschalten (blendet auch bisherige Zahlen aus).
  nachweis: true
  # Wie oft der Baunachweis ins Teamprotokoll geschrieben wird (Minuten; zusätzlich bei Ausfuhr, Neuladen und Serverstopp).
  nachweis-minuten: 5
  # Teamkanal für Spieler mit Build-Studio-Mod (ab 0.10.0): Abschnitte in Inhaberfarbe, Meldungen ohne Befehle, Abgleich mit dem Planer.
  # Die Mod nutzt ihn nur, wenn der Spieler ihn einmal je Server erlaubt (/bauplaner team erlauben). Spieler ohne Mod merken nichts.
  kanal: true

# Geprüfte Lagerkisten (COOP-05, docs/architecture/team/LAGERKISTEN.md). Baumeister markieren Kisten mit /bauplaner lager markieren.
# Das Plugin zählt beim Öffnen und Schließen, bucht Ein- und Ausgaben je Spieler und meldet Abweichungen. Es verändert nie Kisteninhalte.
lager:
  # sperren: verbotene Klicks, Abbau und Anbau werden verhindert · hinweis: erlaubt, aber gebucht und den Baumeistern gemeldet.
  modus: sperren
  # Schutzstufe neuer Lager: offen, team (Team legt ein, ab Helfer entnehmen), abschnitt (entnehmen nur Inhaber des Abschnitts
  # und Baumeister), eingang (alle legen ein, entnehmen nur Baumeister) oder gesperrt (nur Baumeister und Bauleitung).
  schutz-standard: team
  # Trichter und Trichterloren: einlegen (dürfen füllen, nicht leeren), beides oder aus.
  trichter: einlegen
  # Trichterbuchungen je Lager höchstens alle so viele Sekunden (gebündelt, hält das Teamprotokoll klein).
  trichter-buendeln-sekunden: 60
  # Ertragskisten (Zweck ertrag, Sammeltruhe einer Farm): alle so viele Minuten einen Ertrag mit Laufzeit melden (mindestens 5).
  ertrag-minuten: 30
  # Explosionen (Creeper, TNT, Betten) zerstören markierte Lager nicht.
  explosionsschutz: true
  # Lager prüfen, sobald ihr Chunk geladen wird (höchstens einmal je Minute und Lager).
  pruefen-beim-laden: true
  # Abweichungen und fehlende Kisten im Chat an Baumeister und Bauleitung melden (online und beim Betreten).
  meldung-an-baumeister: true

# Weltplan des Teams (WORLD-SHARE-01): kommt über den Team-Raum, sobald der Server mit ihm verbunden ist – keine Datei.
# Ist BlueMap oder Dynmap installiert, schreibt das Plugin Projekte, Bauplätze, Wege, Zonen und Punkte selbst als Marker.
weltplan:
  # Im Planer gesperrte Bauplätze, Zonen und Wege: aus (kein Schutz), hinweis (Chatzeile, Bauen erlaubt) oder sperren
  # (Setzen, Abbauen und Eimer verhindert; bauplaner.weltplan.umgehen ausgenommen). Ändern: /bauplaner weltplan sperren …
  sperren: aus
