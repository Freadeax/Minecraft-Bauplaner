name: BauplanerBridge
version: '${version}'
main: io.github.freadeax.bauplaner.bridge.paper.BridgePlugin
api-version: '${apiVersion}'
description: Liest den Bereich eines Bauplans aus der Serverwelt und schreibt eine Aufnahme für den Minecraft-Bauplaner. Verändert die Welt nie.
author: Freadeax
website: https://freadeax.github.io/Minecraft-Bauplaner/#/mod
commands:
  bauplaner:
    description: Bauplan laden, Anker setzen und den Baufortschritt aufnehmen.
    usage: /bauplaner [plaene|plan|anker|scan|abbrechen|status|team|abschnitte|nehmen|abgeben|fertig|zeigen|notiz|notizen|geliefert|sammle|zuweisen|pruefen|rolle]
    aliases: [bp]
    permission: bauplaner.use
permissions:
  bauplaner.use:
    description: Pläne laden, Anker setzen und Aufnahmen bereits geladener Bereiche schreiben.
    default: true
  bauplaner.nachladen:
    description: Bei der Aufnahme nicht geladene, aber bereits erzeugte Chunks nachladen (kostet Serverleistung).
    default: op
  bauplaner.abbrechen.alle:
    description: Aufnahmen anderer Spieler abbrechen.
    default: op
  bauplaner.team.use:
    description: Teambau – Abschnitte nehmen, fertig melden, Notizen und Lieferungen; was jemand darf, sagt zusätzlich seine Rolle im Team.
    default: true
  bauplaner.team.leitung:
    description: Teamdateien laden und ausführen, Rollen vergeben, vom Schutz ausgenommen.
    default: op
