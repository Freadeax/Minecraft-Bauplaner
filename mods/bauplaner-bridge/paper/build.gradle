// Paper-Plugin der Bauplaner-Brücke (serverseitig). Eine .jar für viele Minecraft-Versionen: kompiliert
// gegen die älteste unterstützte Paper-API (1.18.2) mit Java-17-Bytecode und nutzt nur Bukkit-/Paper-
// Schnittstellen, die bis 26.x unverändert bestehen. Versionsabhängige Aufrufe stehen in PaperCompat.
// Der versionsneutrale Kern wird wie beim Fabric-Adapter als Quelltext eingebunden.
plugins {
    id 'java'
}

base { archivesName = 'bauplaner-bridge-paper' }
version = rootProject.file('VERSION').text.trim()
group = 'io.github.freadeax.bauplaner'

repositories {
    mavenCentral()
    maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_api_version}"
    // Unit tests of the pure rules (StoreLedger, TeamLog) – Gson comes with the Paper API.
    testImplementation "io.papermc.paper:paper-api:${paper_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

sourceSets.main.java.srcDir '../core/src/main/java'
// Teamkanal (COOP-03): dasselbe Nachrichtenformat wie die Mod – Json, TeamWire und die Sende-Warteschlange WsQueue aus dem Mod-Kern.
def teamWire = tasks.register('teamWireSources', Sync) {
    from('../mod-core/src/main/java') {
        include 'io/github/freadeax/bauplaner/mod/live/Json.java'
        include 'io/github/freadeax/bauplaner/mod/team/TeamWire.java'
        include 'io/github/freadeax/bauplaner/mod/live/WsQueue.java'
    }
    into layout.buildDirectory.dir('generated/teamwire')
}
sourceSets.main.java.srcDir teamWire

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8'; options.compilerArgs << '-Xlint:deprecation' }

processResources {
    def props = [version: project.version, apiVersion: paper_plugin_api_version]
    inputs.properties props
    filesMatching('plugin.yml') { expand props }
}
