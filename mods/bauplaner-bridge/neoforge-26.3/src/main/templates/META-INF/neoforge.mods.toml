issueTrackerURL="https://github.com/Freadeax/Minecraft-Bauplaner/issues"

[[mods]]
modId="bauplaner_bridge"
version="${version}"
displayName="Bauplaner-Brücke"
displayURL="https://freadeax.github.io/Minecraft-Bauplaner/#/mod"
authors="Freadeax"
description='''
Bauplaner-Pläne als Hologramm mit Live-Abgleich, Materialliste, Ebenen und Platzierhilfe, dazu die Aufnahme für den Soll/Ist-Vergleich des Minecraft-Bauplaners. Reine Client-Mod: baut nie selbst, sendet nichts ins Internet, braucht nichts auf dem Server.
'''

[[dependencies.bauplaner_bridge]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.bauplaner_bridge]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
