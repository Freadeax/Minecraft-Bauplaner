// NeoForge-Adapter für Minecraft 26.3 (clientseitig). Aufbau nach dem NeoForge-MDK 26.3 (ModDevGradle).
// Kern (loaderneutral), mod-core, hologram-26.3 (Client-Mod 2.0, mit Fabric geteilt) und client-26.3 (nur Vanilla-Klassen, mit Forge geteilt) werden als Quelltext
// eingebunden; die fertige .jar braucht nur NeoForge.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

base { archivesName = "bauplaner-bridge-neoforge-${minecraft_version}" }
version = rootProject.file('VERSION').text.trim()
group = 'io.github.freadeax.bauplaner'

sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.java.srcDir '../client-26.3/src/main/java'
// Client mod 2.0 (hologram, live check, material list, placement helper): same sources as the Fabric mod.
sourceSets.main.java.srcDir '../mod-core/src/main/java'
evaluationDependsOn(':mod-core')
sourceSets.main.java.srcDir(files(project(':mod-core').teamLogRoot).builtBy(project(':mod-core').teamLogTask))
sourceSets.main.java.srcDir '../hologram-26.3/src/main/java'
sourceSets.main.resources.srcDir '../hologram-26.3/src/main/resources'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }

neoForge {
    version = project.loader_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
    }
    mods {
        bauplaner_bridge { sourceSet(sourceSets.main) }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [version: project.version, minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Echter Spieltest: eigener Quellsatz mit Testmod (nicht in der ausgelieferten .jar). Startet den
// NeoForge-Client mit Mod und Testmod; ClientScenario legt eine Testwelt an, baut den Plan und tippt die
// Befehle. Nur über scripts/test_bridge_ingame.sh neoforge.
sourceSets {
    gametest {
        java.srcDir '../client-26.3/src/gametest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge {
    addModdingDependenciesTo sourceSets.gametest
    mods {
        bauplaner_bridge_gametest { sourceSet(sourceSets.gametest) }
    }
    runs {
        gameTestClient {
            client()
            sourceSet = sourceSets.gametest
            loadedMods = [mods.bauplaner_bridge, mods.bauplaner_bridge_gametest]
            gameDirectory = project.file('build/run/gametest')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}
