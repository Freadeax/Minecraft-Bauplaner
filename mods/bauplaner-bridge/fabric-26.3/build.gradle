// Fabric-Adapter für Minecraft 26.3 (clientseitig). Aufbau nach fabric-example-mod, Zweig 26.3.
// Der versionsneutrale Kern wird als Quelltext eingebunden; die fertige .jar braucht nur Fabric API.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = "bauplaner-bridge-fabric-${minecraft_version}" }
version = rootProject.file('VERSION').text.trim()
group = 'io.github.freadeax.bauplaner'

sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.java.srcDir '../mod-core/src/main/java'
sourceSets.main.java.srcDir '../hologram-26.3/src/main/java'
sourceSets.main.resources.srcDir '../hologram-26.3/src/main/resources'

// Echter Spieltest (Fabric Client Game Test): startet Minecraft 26.3 mit der Mod, baut einen Plan per
// Testbefehl auf und lässt die Mod ihn wie ein Spieler aufnehmen. Nur über scripts/test_bridge_ingame.sh,
// der Testcode landet nicht in der ausgelieferten .jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'bauplaner_bridge_gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def props = [version: project.version, minecraft: minecraft_version, loader: loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Verträglichkeit mit einem echten Modpack: dieselbe Spielprüfung in einem Produktionsstart (ohne
// Entwicklungsumgebung) mit der ausgelieferten .jar und allen Mods aus -PmodpackMods=<mods-Ordner>.
tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest'
}
if (providers.gradleProperty('modpackMods').isPresent()) {
    tasks.register('runModpackGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        mods.from(tasks.named('jar'), tasks.named('gametestJar'))
        mods.from(fileTree(providers.gradleProperty('modpackMods').get()) { include '*.jar' })
        jvmArgs.add('-Dfabric.client.gametest')
        useXVFB = false
        runDir = layout.buildDirectory.dir('run/modpackGameTest')
    }
}
